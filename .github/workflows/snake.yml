name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Snake Animation
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: joaovic-tech
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF007F
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF007F&color_dots=#161b22,#003b46,#00737f,#00b3c4,#00ffff

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
